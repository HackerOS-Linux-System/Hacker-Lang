[workspace]
members = [
    "source-code/core",
    "source-code/parser",
    "source-code/coreutils",
    "source-code/shell",
    "source-code/cli",
    "source-code/compiler",
    "source-code/jit",
    "source-code/playground",
]
exclude = [
    "source-code/vendor/hk-parser",
    "runtest",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0"
authors = ["HackerOS Team <hackeros068@gmail.com>"]

[workspace.dependencies]
anyhow        = "1"
colored       = "2"
dirs          = "5"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap          = { version = "4", features = ["derive"] }
rustyline     = "12"
rustc-hash    = "1"
smallvec      = "1"
which         = "6"
nix           = { version = "0.29", features = ["user"] }
thiserror     = "1.0"
# Świadomie PRZYPIĘTE na 0.132.3, nie na najnowszym wydaniu (próbowano
# 0.134.3 → 0.134.4 → 0.135.0). Powód: `MemFlags` w API load/store od
# cranelift-codegen 0.134.x wymaga konwersji `Into<MemFlagsData>`, którą
# implementuje TYLKO wewnętrzny `MachMemFlags`, nie publiczny `MemFlags` —
# potwierdzone jako realny błąd kompilacji w DWÓCH niezależnych, osobno
# opublikowanych wydaniach (0.134.4 ORAZ 0.135.0), nie tylko w jednym
# przejściowym patchu. W repozytorium wasmtime na GitHubie (branch `main`,
# ta sama linia rozwoju cranelift co ich własna, jeszcze NIEOPUBLIKOWANA na
# crates.io kopia) `MemFlags::trusted()` działa poprawnie z `ins().load()` —
# czyli poprawka najwyraźniej już istnieje w rozwoju, tylko jeszcze nie
# trafiła do wydania na crates.io. Dopóki nie trafi, każda kolejna próba
# bumpowania to zgadywanie tego samego, złamanego zachowania pod nowym
# numerkiem. 0.132.3 to ostatnia opublikowana wersja, przy której cały ten
# moduł (Trace JIT + whole-function JIT + trace linking + inlining)
# kompilował się od razu, bez niespodzianek — jeśli chcesz spróbować nowszej
# wersji w przyszłości, sprawdź najpierw samodzielnie `cargo build` z nią,
# zanim poprosisz o kolejną rundę poprawek pod nią.
cranelift-codegen  = { version = "0.132.3", features = ["all-arch"] }
cranelift-frontend = "0.132.3"
cranelift-jit      = "0.132.3"
cranelift-module   = "0.132.3"
cranelift-native   = "0.132.3"
bincode            = "1"
# Konflikt "failed to select a version for `indexmap`" brał się stąd, że TU
# była twarda blokada "=2.1.0" (dokładnie ta jedna wersja, zero elastyczności),
# podczas gdy hk-parser >=0.3.1 wymaga transitywnie `indexmap = "^2.14.0"`.
# Cargo unifikuje jedną wersję indexmap w całym grafie zależności w obrębie
# gałęzi 2.x — z dokładnym pinem "=2.1.0" te dwa wymagania nigdy nie mogły
# zostać spełnione jednocześnie. "2" (bez "=") pozwala Cargo wybrać
# najnowszą kompatybilną 2.x (obecnie 2.14.0 — dokładnie to, czego chce
# hk-parser), zamiast blokować się na jednej konkretnej wersji.
indexmap           = "2"
hk-parser          = "0.3.2"
# Tylko source-code/playground (target wasm32-unknown-unknown) tego używa —
# glue do wywoływania funkcji Rust z JS i z powrotem. Wersja "0.2" to
# wieloletnia, bardzo stabilna linia (wszystkie 0.2.x są wzajemnie
# kompatybilne wg semver wasm-bindgen).
wasm-bindgen       = "0.2"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
opt-level     = 3
